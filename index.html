<!-- ========================================
     카드 3 - 합성 실패 재생
======================================== -->

<section class="replay-section">

    <div class="section-title">
        <div>
            <p class="eyebrow">FAILURE REPLAY</p>
            <h2>외부 데이터 실패 재생</h2>
        </div>

        <p>
            실제 사용자 데이터가 아닌 공개 합성 fixture 상태를 재생합니다.
        </p>
    </div>


    <!-- 현재 데이터 상태 -->

    <div class="replay-status-card">

        <div>

            <p class="info-label">
                현재 데이터 상태
            </p>

            <strong id="readingStatus">
                fresh
            </strong>

        </div>


        <div>

            <p class="info-label">
                오류 코드
            </p>

            <strong id="errorCode">
                none
            </strong>

        </div>


        <div>

            <p class="info-label">
                저장된 일별 기록
            </p>

            <strong id="recordCount">
                0건
            </strong>

        </div>

    </div>


    <!-- 오류 설명 -->

    <div
        class="failure-message"
        id="failureMessage"
    >

        <strong>
            정상 상태입니다.
        </strong>

        <p>
            현재 데이터가 정상적으로 처리되었습니다.
        </p>

    </div>


    <!-- 합성 fixture 버튼 -->

    <div class="fixture-controls">

        <button
            class="fixture-btn normal-btn"
            data-fixture="T04-NORMAL-D1-A"
        >
            D1-A 정상
        </button>


        <button
            class="fixture-btn normal-btn"
            data-fixture="T04-NORMAL-D1-B"
        >
            D1-B 정상
        </button>


        <button
            class="fixture-btn normal-btn"
            data-fixture="T04-NORMAL-D2"
        >
            D2 정상
        </button>


        <button
            class="fixture-btn"
            data-fixture="T04-TIMEOUT"
        >
            느린 응답
        </button>


        <button
            class="fixture-btn"
            data-fixture="T04-AUTH-401"
        >
            401 거절
        </button>


        <button
            class="fixture-btn"
            data-fixture="T04-RATE-429"
        >
            호출 제한
        </button>


        <button
            class="fixture-btn"
            data-fixture="T04-OFFLINE"
        >
            오프라인
        </button>


        <button
            class="fixture-btn"
            data-fixture="T04-SCHEMA-BREAK"
        >
            형식 변경
        </button>

    </div>


    <!-- 마지막 정상값 -->

    <div class="last-good-card">

        <div class="last-good-title">

            <div>
                <p class="eyebrow">
                    LAST KNOWN GOOD
                </p>

                <h3>
                    마지막 정상값
                </h3>
            </div>


            <span
                class="stale-badge"
                id="staleBadge"
            >
                FRESH
            </span>

        </div>


        <div
            class="last-good-value"
            id="lastKnownGoodValue"
        >
            정상 데이터를 아직 불러오지 않았습니다.
        </div>


        <p
            class="last-good-date"
            id="lastKnownGoodDate"
        >
            -
        </p>

    </div>


    <!-- 다음 행동 -->

    <div class="next-action-card">

        <h3>
            다음 행동
        </h3>

        <p id="nextAction">
            정상 데이터를 조회할 수 있습니다.
        </p>


        <button
            id="retryButton"
            class="retry-button"
            disabled
        >
            다시 시도
        </button>

    </div>


    <!-- 테스트 초기화 -->

    <button
        id="resetReplay"
        class="reset-button"
    >
        합성 테스트 초기화
    </button>


    <!-- 일별 기록 -->

    <div class="history-card">

        <h3>
            합성 일별 기록
        </h3>


        <div id="dailyHistory">

            <p class="empty-history">
                아직 합성 기록이 없습니다.
            </p>

        </div>

    </div>

</section>
